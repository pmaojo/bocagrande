name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
          - python-version: "3.13"
          - python-version: "3.14"
          # 3.15 is experimental until Streamlit allows pyarrow>=26 (the first release with 3.15 wheels).
          - python-version: "3.15"
            experimental: true
    continue-on-error: ${{ matrix.experimental == true }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Install dependencies
        if: matrix.python-version != '3.15'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e . --no-deps
      - name: Install dependencies (3.15)
        if: matrix.python-version == '3.15'
        run: |
          # Streamlit pins pyarrow<26, but pyarrow 26 is the first release with 3.15 wheels.
          pip install uv
          echo "pyarrow>=26" > overrides.txt
          uv pip install --system --override overrides.txt -r requirements.txt -r requirements-dev.txt
          pip install -e . --no-deps
      - name: Lint
        run: flake8 .
      - name: Unit tests
        run: pytest
